name: atelierpro_mobile
description: "AtelierPro — gestion d'atelier pour artisans (Niger)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  provider: ^6.1.2
  go_router: ^14.2.0
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFBF8" # Couleur AtelierProColors.sable
  image: assets/logo.png
  android_12:
    color: "#FFFBF8"
    image: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
